name = "jrp-live-queue"
main = "src/index.js"
compatibility_date = "2026-01-01"

# */5: re-parse gig times from jaerichent.com and auto-reset the queue
#      (archive 30 min before / 30 min after each gig window)
# monthly: Crowd Favorites digest email on the 1st (~8-9 AM Central)
[triggers]
crons = ["*/5 * * * *", "0 14 1 * *"]

[[d1_databases]]
binding = "DB"
database_name = "jrp-live-queue"
database_id = "62424991-17b1-4ae7-ac51-90885f56acdf"
